{% extends "base.html" %}
{% block content %}
<h1>Journal</h1>
<form class="stack" method="post" action="/journal" style="margin-bottom: 24px;">
  <div><label>Asset (optional)</label><input name="asset"></div>
  <div><label>Entry</label><textarea name="entry_text" rows="3" required></textarea></div>
  <button type="submit">Add entry</button>
</form>
{% if entries %}
<table>
  <tr><th>Date</th><th>Asset</th><th>Entry</th></tr>
  {% for e in entries %}
  <tr><td>{{ e.created_at.strftime("%Y-%m-%d") }}</td><td>{{ e.asset or "—" }}</td><td>{{ e.entry_text }}</td></tr>
  {% endfor %}
</table>
{% else %}
<p class="empty">No journal entries yet.</p>
{% endif %}
{% endblock %}
